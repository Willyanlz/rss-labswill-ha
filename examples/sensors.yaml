# Exemplo: cadastre g1_araraquara em /config/rss-feeds.json antes de usar.
# Mescle em configuration.yaml sem duplicar a chave command_line.
command_line:
  - sensor:
      name: Notícias G1 Araraquara e região
      unique_id: noticias_g1_sao_carlos
      icon: mdi:rss
      scan_interval: 600
      command: "python3 /config/scripts/fetch-rss.py g1_araraquara"
      command_timeout: 60
      value_template: "{{ value_json.articles | count }} artigos"
      json_attributes:
        - articles
