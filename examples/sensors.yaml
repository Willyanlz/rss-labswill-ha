# Mescle em configuration.yaml. Não crie duas chaves command_line no mesmo arquivo.
command_line:
  - sensor:
      name: Noticias Minha Fonte
      unique_id: labswill_rss_minha_fonte
      command: python3 /config/scripts/fetch-rss.py minha_fonte
      command_timeout: 90
      scan_interval: 600
      value_template: "{{ value_json.articles | length }}"
      json_attributes:
        - articles
  - sensor:
      name: Noticias Outra Fonte
      unique_id: labswill_rss_outra_fonte
      command: python3 /config/scripts/fetch-rss.py outra_fonte
      command_timeout: 90
      scan_interval: 600
      value_template: "{{ value_json.articles | length }}"
      json_attributes:
        - articles
